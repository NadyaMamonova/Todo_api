services:
  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test_todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - todo_network

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      - PGPASSWORD=postgres
      - TESTING=true
      - DB_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TEST_DB_NAME=test_todo_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo_network
    command: >
      sh -c "python -m pytest -xvs --cov=app --cov-report=term-missing"

volumes:
  postgres_data:

networks:
  todo_network:
    driver: bridge